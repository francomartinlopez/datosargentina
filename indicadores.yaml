# Catálogo de indicadores — etapa 1 (núcleo de prueba)
#
# Cada serie de "series" es un dato crudo que se baja de una fuente.
# Cada entrada de "indicadores" es lo que se publica en el sitio.
#
# tipo_valor:
#   indice  -> nivel de un índice (IPC, EMAE): variaciones en %
#   nivel   -> stock o monto (reservas, salario): variaciones en %, se puede deflactar
#   flujo   -> monto de un período (exportaciones, recaudación): igual que nivel
#   tasa    -> porcentaje o puntos (desocupación, tasas de interés, riesgo país): variaciones en puntos
#   saldo   -> monto que cambia de signo (resultado fiscal, saldo comercial): variaciones como diferencia
# vista_historica: mensual -> la vista "desde 2003" muestra la variación mensual (índices de precios)
# moneda: ARS | USD | (vacío) -> si es ARS o USD se expresa en moneda constante del último mes.

parametros:
  inicio_historico: "2003-05-01"      # vista "desde 2003" (asunción de Néstor Kirchner)
  base_gestion_actual: "2023-11-01"   # mes previo a la asunción del gobierno actual

gestiones:
  - {nombre: "Néstor Kirchner", asuncion: "2003-05-25", base: "2003-04-01"}
