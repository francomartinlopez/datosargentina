# IPC empalmado: se encadenan las variaciones mensuales de cada tramo.
# 2007-2016 se reemplaza el IPC del INDEC (no confiable) por San Luis y CABA.
empalmes:
  ipc:
    - {serie: ipc_gba_historico, hasta: "2006-12-01"}
    - {serie: ipc_san_luis,      hasta: "2012-07-01"}
    - {serie: ipc_caba_2012,     hasta: "2016-12-01"}
    - {serie: ipc_nacional}
  consumo_vacuna:
    - {serie: fao_vacuna, hasta: "2015-01-01"}
    - {serie: consumo_vacuna_sagyp_2024, hasta: "2024-01-01"}
    - {serie: consumo_vacuna_sagyp}
  consumo_aviar:
    - {serie: fao_aviar, hasta: "2015-01-01"}
    - {serie: consumo_aviar_sagyp_2024, hasta: "2024-01-01"}
    - {serie: consumo_aviar_sagyp}
  consumo_porcina:
    - {serie: fao_porcina, hasta: "2015-01-01"}
    - {serie: consumo_porcina_sagyp_2024, hasta: "2024-01-01"}
    - {serie: consumo_porcina_sagyp}
  consumo_leche:
    - {serie: fao_leche, hasta: "2022-01-01"}
    - {serie: consumo_leche_ocla}

calculos:
  saldo_comercial: {operacion: resta, a: exportaciones, b: importaciones}
  brecha_ccl:      {operacion: brecha, a: dolar_ccl, b: dolar_mayorista}
  # Deciles 1 y 2 vienen vacíos en la API: como cada decil tiene el 10% de las personas, el promedio
  # total es el promedio de los 10 deciles y el estrato bajo = (10·total − deciles 5 a 10) / 4
  ipcf_estrato_bajo:  {operacion: combinacion, terminos: {ipcf_total: 2.5, ipcf_decil_5: -0.25, ipcf_decil_6: -0.25, ipcf_decil_7: -0.25, ipcf_decil_8: -0.25, ipcf_decil_9: -0.25, ipcf_decil_10: -0.25}}
  ipcf_estrato_medio: {operacion: promedio, series: [ipcf_decil_5, ipcf_decil_6, ipcf_decil_7, ipcf_decil_8]}
  ipcf_estrato_alto:  {operacion: promedio, series: [ipcf_decil_9, ipcf_decil_10]}
  balanza_energetica: {operacion: resta, a: expo_combustibles, b: impo_combustibles}
  brecha_mep:      {operacion: brecha, a: dolar_mep, b: dolar_mayorista}
  brecha_tarjeta:  {operacion: brecha, a: dolar_tarjeta, b: dolar_mayorista}
  # La serie IMIG de resultado financiero viene vacía en la API: se calcula como primario menos intereses netos
  resultado_financiero: {operacion: resta, a: resultado_primario, b: intereses_netos}
  presion_tributaria: {operacion: porcentaje_pib, a: recaudacion, b: pib_nominal}
  pib_jubilaciones: {operacion: porcentaje_pib, a: imig_jubilaciones, b: pib_nominal}
  pib_pensiones_nc: {operacion: porcentaje_pib, a: imig_pensiones_nc, b: pib_nominal}
  pib_asignaciones: {operacion: porcentaje_pib, a: imig_asignaciones, b: pib_nominal}
  pib_pami: {operacion: porcentaje_pib, a: imig_pami, b: pib_nominal}
  pib_otros_programas: {operacion: porcentaje_pib, a: imig_otros_programas, b: pib_nominal}
  pib_subsidios_energia: {operacion: porcentaje_pib, a: imig_subsidios_energia, b: pib_nominal}
  pib_subsidios_transporte: {operacion: porcentaje_pib, a: imig_subsidios_transporte, b: pib_nominal}
  pib_salarios: {operacion: porcentaje_pib, a: imig_salarios, b: pib_nominal}
  pib_funcionamiento: {operacion: porcentaje_pib, a: imig_funcionamiento, b: pib_nominal}
  pib_intereses: {operacion: porcentaje_pib, a: imig_intereses, b: pib_nominal}
  tasa_real_plazo_fijo: {operacion: tasa_real, a: tasa_plazo_fijo, b: ipc}
  merval_usd:      {operacion: cociente, a: merval, b: dolar_ccl}
  # PIB y FBCF trimestrales en pesos corrientes vienen anualizados: se dividen por 4
  ied_inversion:   {operacion: porcentaje_de, a: bdp_ied, b: fbcf_corriente, multiplicar: dolar_mayorista, divisor_b: 4, acumular: 4}
  salario_usd:     {operacion: cociente, a: remuneracion_sipa, b: dolar_ccl}

