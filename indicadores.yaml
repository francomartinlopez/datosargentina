  ipcf_estrato_medio: {operacion: promedio, series: [ipcf_decil_5, ipcf_decil_6, ipcf_decil_7, ipcf_decil_8]}
  ipcf_estrato_alto:  {operacion: promedio, series: [ipcf_decil_9, ipcf_decil_10]}
  balanza_energetica: {operacion: resta, a: expo_combustibles, b: impo_combustibles}
  brecha_mep:      {operacion: brecha, a: dolar_mep, b: dolar_mayorista}
