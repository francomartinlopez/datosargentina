     nota: "Gasto base caja del Sector Público Nacional no financiero (Informe Mensual de Ingresos y Gastos, Ministerio de Economía), últimos 4 trimestres en % del PIB nominal. Datos desde 2016. Para la apertura por función (educación, salud, defensa) con serie larga ver el gráfico de gasto por función, que llega hasta 2023."}
  - {id: gasto_funcion, nombre: "Gasto público nacional por función (serie larga, hasta 2023)", seccion: "Estado y fiscal", ranking: nivel, unidad_ranking: "% del PIB", sufijo_ranking: "% del PIB",
     nota: "Gasto de la Administración Pública Nacional por finalidad y función (Ministerio de Economía, serie de gasto público consolidado). La serie se publica con varios años de rezago: el último año disponible es 2023."}
