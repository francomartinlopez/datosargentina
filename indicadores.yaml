# IPC empalmado: se encadenan las variaciones mensuales de cada tramo.
# 2007-2016 se reemplaza el IPC del INDEC (no confiable) por San Luis y CABA.
empalmes:
  ipc:
    - {serie: ipc_gba_historico, hasta: "2006-12-01"}
    - {serie: ipc_san_luis,      hasta: "2012-07-01"}
    - {serie: ipc_caba_2012,     hasta: "2016-12-01"}
    - {serie: ipc_nacional}

calculos:
  saldo_comercial: {operacion: resta, a: exportaciones, b: importaciones}
  brecha_ccl:      {operacion: brecha, a: dolar_ccl, b: dolar_mayorista}
  balanza_energetica: {operacion: resta, a: expo_combustibles, b: impo_combustibles}
  brecha_mep:      {operacion: brecha, a: dolar_mep, b: dolar_mayorista}
  brecha_tarjeta:  {operacion: brecha, a: dolar_tarjeta, b: dolar_mayorista}
