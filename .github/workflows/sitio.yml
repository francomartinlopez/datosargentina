name: Publicar sitio

# Publica sitio/public en GitHub Pages cada vez que cambia en main
# (por ejemplo, al aprobar el PR de la actualización mensual).

on:
  push:
    branches: [main]
    paths: ["sitio/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio/public
      - id: despliegue
        uses: actions/deploy-pages@v4
