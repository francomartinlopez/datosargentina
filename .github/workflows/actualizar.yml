name: Actualización mensual de datos

on:
  schedule:
    - cron: "0 12 20 * *"   # día 20 de cada mes, 9:00 de Argentina
  workflow_dispatch: {}     # permite lanzarla a mano desde la pestaña Actions

permissions:
  contents: write
  pull-requests: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m pytest -q

      - name: Herramientas para abrir bases viejas de la EPH (.rar)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unar
      - name: Bajar y procesar datos
        run: python -m pipeline.construir
        env:
          INDEC_API_TOKEN: ${{ secrets.INDEC_API_TOKEN }}

      - name: Control de minería, datos regionales y vista por rubro
        # deja constancia en el informe (cuerpo del PR) de qué indicadores nuevos se publicaron
        run: |
          python - <<'PY'
          import json, pathlib
          d = pathlib.Path("sitio/public/datos")
          grupos = {
              "Minería": ["metaliferos", "oro_plata", "litio", "litio_toneladas", "expo_mineras", "rigi"],
              "Santa Fe, Córdoba y AMBA": ["desoc_regional", "empleo_regional", "asal_regional", "inflacion_caba", "ipc_santa_fe", "ipc_cordoba", "expo_cordoba", "pgb_cordoba"],
          }
          lineas = ["", "## Indicadores de minería y regionales", ""]
          for g, ids in grupos.items():
              for i in ids:
                  f = d / f"{i}.json"
                  if not f.exists():
                      lineas.append(f"- {g}: **{i} no se publicó**")
                      continue
                  j = json.loads(f.read_text())
                  ult = (j.get("ultimo") or {}).get("fecha") or j.get("fecha", "")
                  lineas.append(f"- {g}: {j.get('nombre', i)} (último dato {ult})")
          rubros = json.loads((d / "rubros.json").read_text()) if (d / "rubros.json").exists() else []
          lineas.append(f"- Vista por rubro: " + ", ".join(f"{r['nombre']} ({len(r['items'])})" for r in rubros))
          texto = "\n".join(lineas) + "\n"
          with open("data/informe.md", "a", encoding="utf-8") as fh:
              fh.write(texto)
          print(texto)
          PY

      - name: Proponer cambios para revisión
        uses: peter-evans/create-pull-request@v7
        with:
          branch: actualizacion-mensual
          delete-branch: true
          commit-message: "Actualización de datos"
          title: "Actualización de datos"
          body-path: data/informe.md
          labels: datos
